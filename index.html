<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cold Rum Race Availability</title>
  <meta name="description" content="Choose which Cold Rum races you are available for.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #23272d;
      --bg-strong: #2e343c;
      --text: #f2f4f3;
      --muted: #aeb6b1;
      --accent: #d7dbd8;
      --accent-dark: #bfc5c1;
      --track: #565c59;
      --line: rgba(255, 255, 255, 0.11);
      --white: #ffffff;
      --shadow: 0 24px 70px rgba(3, 12, 26, 0.46);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 14px;
      background:
        radial-gradient(circle at top left, rgba(92, 112, 139, 0.2), transparent 28%),
        linear-gradient(145deg, #101419 0%, #27303a 52%, #15181d 100%);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    .poll {
      width: min(448px, 100%);
      overflow: hidden;
      border-radius: 18px;
      background: var(--bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow);
    }

    .poll__inner {
      padding: 20px 14px 16px;
    }

    .poll h1 {
      margin: 0 0 12px;
      font-size: clamp(1.55rem, 7vw, 1.85rem);
      line-height: 1.1;
      font-weight: 500;
      letter-spacing: 0;
    }

    .hint {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: clamp(1.1rem, 5vw, 1.45rem);
    }

    .hint__checks {
      position: relative;
      width: 38px;
      height: 22px;
      flex: 0 0 auto;
    }

    .hint__checks span {
      position: absolute;
      top: 1px;
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 999px;
      background: #686d6a;
      color: var(--white);
      font-size: 15px;
      line-height: 1;
    }

    .hint__checks span:first-child {
      left: 0;
    }

    .hint__checks span:last-child {
      left: 15px;
    }

    .person {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
    }

    .person label {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .person input {
      min-height: 46px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 0 12px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      outline: none;
    }

    .person input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.13);
    }

    .options {
      display: grid;
      gap: 8px;
    }

    .option {
      width: 100%;
      padding: 12px 4px 14px 0;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .option__top {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: 0;
    }

    .check {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: transparent;
      font-size: 32px;
      line-height: 1;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .option[aria-pressed="true"] .check {
      background: var(--accent);
      color: #191b1c;
    }

    .option:focus-visible .check {
      outline: 3px solid rgba(255, 255, 255, 0.22);
      outline-offset: 3px;
    }

    .option:active .check {
      transform: scale(0.96);
    }

    .race-title {
      min-width: 0;
      font-size: clamp(1.4rem, 6vw, 1.78rem);
      line-height: 1.12;
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .count {
      width: 36px;
      text-align: right;
      font-size: 1.35rem;
      font-weight: 600;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 56px 1fr;
      margin-top: 11px;
    }

    .bar {
      position: relative;
      height: 16px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--track);
    }

    .bar span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 180ms ease;
    }

    .actions {
      display: grid;
      gap: 9px;
      margin: 14px 0 8px;
    }

    .save {
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #191b1c;
      font-weight: 700;
      cursor: pointer;
    }

    .save:hover {
      background: var(--accent-dark);
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }

    .results {
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      padding: 14px;
    }

    .results h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .result-list {
      display: grid;
      gap: 10px;
    }

    .result {
      display: grid;
      gap: 3px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .result:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .result__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
    }

    .names {
      display: grid;
      gap: 4px;
      min-height: 20px;
      color: var(--muted);
      font-size: 0.96rem;
      line-height: 1.35;
    }

    .name {
      overflow-wrap: anywhere;
    }

    .offline-note {
      display: none;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .is-local .offline-note {
      display: block;
    }

    @media (max-width: 380px) {
      .poll__inner {
        padding-inline: 12px;
      }

      .option__top {
        grid-template-columns: 50px 1fr auto;
      }

      .check {
        width: 42px;
        height: 42px;
      }

      .bar-row {
        grid-template-columns: 50px 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="poll" id="poll">
    <div class="poll__inner">
      <h1>Cold Rum Race Availability</h1>
      <p class="hint">
        <span class="hint__checks" aria-hidden="true"><span>✓</span><span>✓</span></span>
        <span>Select one or more</span>
      </p>

      <div class="person">
        <label for="name">Your name</label>
        <input id="name" name="name" autocomplete="name" placeholder="Type your name">
      </div>

      <div class="options" id="options" aria-label="Race choices"></div>

      <div class="actions">
        <button class="save" id="save" type="button">Save my availability</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </div>
    </div>

    <section class="results" aria-labelledby="results-title">
      <h2 id="results-title">Results</h2>
      <div class="result-list" id="results"></div>
      <p class="offline-note">
        Shared results are off until you add your Google Apps Script URL in the page settings.
        On this device, entries are saved locally for previewing.
      </p>
    </section>
  </main>

  <script>
    const CONFIG = {
      // Paste your Google Apps Script web app URL here after following README.md.
      endpoint: "https://script.google.com/macros/s/AKfycbwv8O8J7sgTV1fb7CvVfba9WuPDzIbDwfDOtt_hl0DWCAwxV1me9-5TuAUZDaDolXRmvQ/exec",
      races: [
        { id: "cold-rum-1", title: "8/12 - Cold Rum #1" },
        { id: "cold-rum-2", title: "8/19 - Cold Rum #2" },
        { id: "cold-rum-3", title: "8/26 - Cold Rum #3" }
      ]
    };

    const state = {
      selected: new Set(),
      responses: [],
      currentName: ""
    };

    const poll = document.querySelector("#poll");
    const nameInput = document.querySelector("#name");
    const optionsEl = document.querySelector("#options");
    const resultsEl = document.querySelector("#results");
    const saveBtn = document.querySelector("#save");
    const statusEl = document.querySelector("#status");
    const storageKey = "cold-rum-race-availability";
    const hasRemote = Boolean(CONFIG.endpoint.trim());

    poll.classList.toggle("is-local", !hasRemote);

    function cleanName(value) {
      return value.trim().replace(/\s+/g, " ");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function groupedResults() {
      return CONFIG.races.map((race) => {
        const names = state.responses
          .filter((response) => response.races.includes(race.id))
          .map((response) => response.name)
          .sort((a, b) => a.localeCompare(b));

        return { ...race, names, count: names.length };
      });
    }

    function maxCount(groups) {
      return Math.max(1, ...groups.map((group) => group.count));
    }

    function renderOptions() {
      const groups = groupedResults();
      const peak = maxCount(groups);

      optionsEl.innerHTML = CONFIG.races.map((race) => {
        const group = groups.find((item) => item.id === race.id);
        const checked = state.selected.has(race.id);
        const width = Math.round((group.count / peak) * 100);

        return `
          <button class="option" type="button" data-race="${race.id}" aria-pressed="${checked}">
            <span class="option__top">
              <span class="check" aria-hidden="true">✓</span>
              <span class="race-title">${escapeHtml(race.title)}</span>
              <span class="count">${group.count}</span>
            </span>
            <span class="bar-row" aria-hidden="true">
              <span></span>
              <span class="bar"><span style="width: ${width}%"></span></span>
            </span>
          </button>
        `;
      }).join("");
    }

    function renderResults() {
      resultsEl.innerHTML = groupedResults().map((race) => `
        <article class="result">
          <div class="result__head">
            <span>${escapeHtml(race.title)}</span>
            <span>${race.count}</span>
          </div>
          <div class="names">
            ${race.names.length
              ? race.names.map((name) => `<span class="name">${escapeHtml(name)}</span>`).join("")
              : "No one yet"}
          </div>
        </article>
      `).join("");
    }

    function render() {
      renderOptions();
      renderResults();
    }

    function readLocal() {
      const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
      state.responses = Array.isArray(saved) ? saved : [];
    }

    function writeLocal() {
      localStorage.setItem(storageKey, JSON.stringify(state.responses));
    }

    function upsertResponse(name, races) {
      state.responses = state.responses.filter((response) => response.name.toLowerCase() !== name.toLowerCase());
      state.responses.push({ name, races, updatedAt: new Date().toISOString() });
    }

    function jsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = `pollCallback_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const separator = url.includes("?") ? "&" : "?";
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("Timed out loading results."));
        }, 10000);

        function cleanup() {
          clearTimeout(timeout);
          script.remove();
          delete window[callbackName];
        }

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("Could not load results."));
        };

        script.src = `${url}${separator}callback=${encodeURIComponent(callbackName)}`;
        document.body.appendChild(script);
      });
    }

    async function loadRemote() {
      if (!hasRemote) {
        readLocal();
        render();
        return;
      }

      try {
        statusEl.textContent = "Loading results...";
        const data = await jsonp(`${CONFIG.endpoint}?action=results`);
        state.responses = Array.isArray(data.responses) ? data.responses : [];
        statusEl.textContent = "";
        render();
      } catch (error) {
        readLocal();
        statusEl.textContent = "Showing saved results from this device.";
        render();
      }
    }

    async function saveRemote(payload) {
      if (!hasRemote) {
        upsertResponse(payload.name, payload.races);
        writeLocal();
        return;
      }

      await fetch(CONFIG.endpoint, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
    }

    optionsEl.addEventListener("click", (event) => {
      const option = event.target.closest(".option");
      if (!option) return;

      const race = option.dataset.race;
      if (state.selected.has(race)) {
        state.selected.delete(race);
      } else {
        state.selected.add(race);
      }

      renderOptions();
    });

    saveBtn.addEventListener("click", async () => {
      const name = cleanName(nameInput.value);
      const races = [...state.selected];

      if (!name) {
        statusEl.textContent = "Add your name first.";
        nameInput.focus();
        return;
      }

      if (!races.length) {
        statusEl.textContent = "Choose at least one race.";
        return;
      }

      saveBtn.disabled = true;
      statusEl.textContent = "Saving...";

      try {
        await saveRemote({ name, races, updatedAt: new Date().toISOString() });
        state.currentName = name;
        if (hasRemote) {
          setTimeout(loadRemote, 900);
        } else {
          render();
          statusEl.textContent = "Saved on this device.";
        }
      } catch (error) {
        statusEl.textContent = "Could not save. Try again.";
      } finally {
        saveBtn.disabled = false;
      }
    });

    nameInput.addEventListener("input", () => {
      const name = cleanName(nameInput.value);
      const existing = state.responses.find((response) => response.name.toLowerCase() === name.toLowerCase());
      state.selected = new Set(existing ? existing.races : []);
      renderOptions();
    });

    render();
    loadRemote();
  </script>
</body>
</html>
